[project]
name = "fictional-bench"
version = "0.1.0"
description = "fictional-bench"
readme = "README.md"
authors = [
    { name = "Exino329", email = "lorin.lieb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
